name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: work/app/requirements.demo.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.demo.txt
      - run: python manage.py check --settings=onmsi_mapas.settings_pruebas
      - run: python manage.py test --settings=onmsi_mapas.settings_pruebas
